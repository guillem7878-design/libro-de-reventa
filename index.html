  const ex = (w, c, t, s) => `<button class="row" data-action="export" data-what="${w}"><span class="th" style="${tint(c)}">${G.down}</span><span class="rm"><span class="rt">${t}</span><span class="rs">${s}</span></span>${G.chev}</button>`;
  openSheet('Ajustes', `<div class="list"><button class="row" data-action="catalog"><span class="th" style="${tint('var(--ink)')}">${G.box}</span><span class="rm"><span class="rt">Mi lista de pedidos</span><span class="rs">${S.catalog.length ? S.catalog.length + (S.catalog.length === 1 ? ' artículo' : ' artículos') : 'Lo que compras siempre'}</span></span>${G.chev}</button></div>${downloads ? `<div class="list">${ex('sales', 'var(--c1)', 'Exportar ventas', 'Fecha, producto, talla, precio, móvil e IBAN')}${ex('expenses', 'var(--warn)', 'Exportar gastos', 'Pedidos y otros gastos')}${ex('stock', 'var(--c5)', 'Exportar stock', 'Productos, tallas y unidades')}</div><p class="hint" style="margin:-6px 0 0">Archivos que se abren con Excel o Google Sheets.</p>` : ''}
    ${S.desk ? '' : `<div class="fld"><span class="lbl">Al abrir en el móvil</span><div class="seg" data-k="qpref" style="align-self:flex-start">${[['1', 'Botones rápidos'], ['0', 'Panel']].map(([k, l]) => `<button data-action="quickPref" data-v="${k}" aria-pressed="${(store.get('quickStart') || '1') === k}">${l}</button>`).join('')}</div></div>`}
    ${window.SYNC ? window.SYNC.settingsHtml() : ''}
    <div class="fld"><span class="lbl">Apariencia</span><div class="seg" data-k="look" style="align-self:flex-start">${[['auto', 'Auto', G.auto], ['light', 'Claro', G.sun], ['dark', 'Oscuro', G.moon]].map(([k, l, i]) => `<button data-action="look" data-v="${k}" aria-pressed="${look === k}">${i}${l}</button>`).join('')}</div></div>`);
}

/* ---------- escritura ---------- */
async function write(fn, ok, undoFn) {
  if (!db) { toast('Sin conexión con tus datos. Recarga la página.'); return false; }
  try { await fn(); if (ok) toast(ok, undoFn); haptic(2); return true; }
  catch (e) { haptic(3); const c = e && e.code; toast(c === 'quota_exceeded' ? 'Base de datos llena. Exporta y borra datos antiguos.' : c === 'invalid_argument' ? 'No se pudo guardar. Revisa los datos.' : 'No se pudo guardar. Comprueba la conexión.'); return false; }
}
let tt, undoAction = null;
function toast(msg, undoFn) {
  const t = $('#toast'); $('#toastTxt').textContent = msg; undoAction = undoFn || null; $('#toastUndo').hidden = !undoFn;
  t.classList.remove('show'); void t.offsetWidth; t.classList.add('show');
  clearTimeout(tt); tt = setTimeout(() => { t.classList.remove('show'); undoAction = null; }, undoFn ? 6000 : 2400);
}
function haptic(n = 1) {
  try { if (navigator.vibrate && !/iP(hone|ad|od)/.test(navigator.userAgent)) { navigator.vibrate(n === 1 ? 10 : n === 2 ? [10, 110, 10] : [10, 90, 10, 90, 10]); return; }
    const l = document.createElement('label'), i = document.createElement('input'); i.type = 'checkbox'; i.setAttribute('switch', ''); l.style.display = 'none'; l.appendChild(i); document.head.appendChild(l); l.click(); l.remove(); } catch (e) {}
}
const strip = x => { const { id, ...r } = x; return r; };
async function setSizes(pid, fn) { const p = prod(pid); if (!p) return; const sizes = (p.sizes || []).map(s => ({ ...s })); fn(sizes); await db.doc('products/' + pid).update({ sizes }); }
const bumpSize = (sizes, size, d) => { const e = sizes.find(s => s.s === size); if (e) e.q = Math.max(0, e.q + d); else if (d > 0) sizes.push({ s: size || 'Única', q: d }); };
let armedT;
function armed(btn, label) {
  if (btn.dataset.armed) return true;
  btn.dataset.armed = '1'; btn.dataset.orig = btn.textContent; btn.textContent = label; haptic(1);
  clearTimeout(armedT); armedT = setTimeout(() => { if (btn.isConnected) { delete btn.dataset.armed; btn.textContent = btn.dataset.orig; } }, 3500);
  return false;
}
async function exportCsv(what) {
  if (!downloads) return;
  const n = v => String(v ?? 0).replace('.', ','), q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  let rows;
  if (what === 'sales') { rows = [['Fecha', 'Producto', 'Categoría', 'Talla', 'Uds', 'Precio', 'Estado', 'Móvil', 'IBAN']];
    S.sales.slice().sort((a, b) => (a.date || '').localeCompare(b.date || '')).forEach(s => { const a = acc(s.account) || {}; rows.push([s.date, q(s.name), q(catOf(s).label), q(s.size), s.qty || 1, n(s.price), s.status === 'devuelta' ? 'Devuelta' : 'Vendida', q(a.name || ''), q(ibanFmt(ibanAt(a, s.date)))]); }); }
  else if (what === 'expenses') { rows = [['Fecha', 'Concepto', 'Tipo', 'Importe', 'Unidades']];
    S.expenses.slice().sort((a, b) => (a.date || '').localeCompare(b.date || '')).forEach(e => rows.push([e.date, q(e.concept), q(EXP_ALL[e.category] || 'Otros'), n(e.amount), e.units || ''])); }
  else { rows = [['Producto', 'Categoría', 'Talla', 'Unidades', 'Coste/ud', 'Precio', 'Móvil']];
    S.products.forEach(p => (p.sizes || []).forEach(s => rows.push([q(p.name), q(catOf(p).label), q(s.s), s.q, n(p.cost), n(p.price), q(p.account ? accName(p.account) : '')]))); }
  try { await downloads.save({ filename: `reventa-${{ sales: 'ventas', expenses: 'gastos', stock: 'stock' }[what]}-${today()}.csv`, data: '﻿' + rows.map(r => r.join(';')).join('\n') }); }
  catch (e) { if (e && e.code !== 'declined') toast('No se pudo exportar'); }
}

/* ---------- eventos ---------- */
document.addEventListener('click', async ev => {
  const b = ev.target.closest('[data-action]'); if (!b || b.disabled) return;
  const a = b.dataset.action, id = b.dataset.id;
  switch (a) {
    case 'tab': haptic(1); if (S.tab === b.dataset.tab) { if (S.accView) { S.accView = ''; S.animate = true; render(); } window.scrollTo({ top: 0, behavior: 'smooth' }); break; } go(b.dataset.tab); break;
    case 'off': S.off = Math.min(0, S.off + +b.dataset.d); S.animate = true; haptic(1); render(); break;
    case 'per': S.per = b.dataset.v; S.off = 0; S.animate = true; render(); break;
    case 'new': haptic(1); newMenu(); break;
    case 'more': moreSheet(); break;
    case 'look': store.set('look', b.dataset.v); applyLook(); render(); moreSheet(); break;
    case 'close': closeSheet(); break;
    case 'undo': { const f = undoAction; undoAction = null; $('#toast').classList.remove('show'); if (f) f(); break; }
    case 'stockCat': S.stockCat = b.dataset.c; render(); break;
    case 'movF': S.movF = b.dataset.f; render(); break;
    case 'movAcc': S.movAcc = S.movAcc === b.dataset.a ? 'all' : b.dataset.a; render(); break;
    case 'stockAcc': S.stockAcc = S.stockAcc === b.dataset.a ? 'all' : b.dataset.a; render(); break;
    case 'goStock': S.stockCat = b.dataset.c; S.stockAcc = 'all'; S.stockQ = ''; go('stock'); break;
    // productos
    case 'newProduct': productForm(); break;
    case 'product': productSheet(id); break;
    case 'editProduct': productForm(prod(id)); break;
    case 'addUnits': addUnitsForm(id); break;
    case 'sellProduct': saleForm({ product: id }); break;
    case 'changePhoto': { const ph = await uploadPhoto(); if (ph && await write(() => db.doc('products/' + id).update({ photo: ph }), 'Foto guardada')) setTimeout(() => productSheet(id), 200); break; }
    case 'adj': { const i = +b.dataset.i, d = +b.dataset.d, p = prod(id), cost = p && d > 0 && p.cost > 0 ? p.cost : 0; let exId = ''; b.disabled = true;
      await write(async () => { await setSizes(id, sz => { sz[i].q = Math.max(0, sz[i].q + d); });
        if (cost) { const x = await db.collection('expenses').add({ concept: 'Reposición · ' + p.name, amount: cost, date: today(), category: 'pedido', units: 1, createdAt: Date.now() }); exId = x.id; } },
        cost ? `+1 ud · gasto ${money(cost)}` : undefined,
        cost ? () => write(async () => { await setSizes(id, sz => { sz[i].q = Math.max(0, sz[i].q - 1); }); if (exId) await db.doc('expenses/' + exId).delete(); }, 'Deshecho') : undefined);
      setTimeout(() => productSheet(id), 120); break; }
    case 'delProduct': { const p = prod(id); if (!p) break; if (armed(b, '¿Seguro? Toca otra vez')) { const copy = strip(p);
      if (await write(() => db.doc('products/' + id).delete(), 'Producto borrado', () => write(() => db.doc('products/' + id).set(copy), 'Recuperado'))) closeSheet(); } break; }
    case 'catalog': catalogSheet(); break;
    case 'catItem': { const c = catList[+b.dataset.k]; if (c) catalogForm(c); break; }
    case 'newCatItem': catalogForm(); break;
    case 'delCat': if (catCur && await catRemove(catCur)) { closeSheet(); setTimeout(catalogSheet, 450); } break;
    case 'orderProduct': { const e = S.expenses.find(x => x.id === id); productForm(null, { orderId: id, cost: e && e.units ? r2(e.amount / e.units) : '' }); break; }
    // ventas
    case 'newSale': saleForm(); break;
    case 'sale': saleDetail(id); break;
    case 'editSale': saleForm({ edit: id }); break;
    case 'returnSale': returnSheet(id); break;
    case 'doReturn1': case 'doReturn0': { const s = S.sales.find(x => x.id === id); if (!s) break; const re = a === 'doReturn1';
      if (await write(async () => { if (re) await setSizes(s.productId, sz => bumpSize(sz, s.size, s.qty || 1)); await db.doc('sales/' + id).update({ status: 'devuelta', returnedAt: today(), restocked: re }); },
        re ? 'Devolución apuntada · vuelve al stock' : 'Devolución apuntada', async () => { await write(async () => { if (re) await setSizes(s.productId, sz => bumpSize(sz, s.size, -(s.qty || 1))); await db.doc('sales/' + id).update({ status: 'ok', returnedAt: '', restocked: false }); }, 'Devolución anulada'); })) closeSheet(); break; }
    case 'unreturn': { const s = S.sales.find(x => x.id === id); if (!s) break;
      if (await write(async () => { if (s.restocked) await setSizes(s.productId, sz => bumpSize(sz, s.size, -(s.qty || 1))); await db.doc('sales/' + id).update({ status: 'ok', returnedAt: '', restocked: false }); }, 'Devolución anulada')) closeSheet(); break; }
    case 'delSale': delSaleSheet(id); break;
    case 'doDel1': case 'doDel0': { const s = S.sales.find(x => x.id === id); if (!s) break; const re = a === 'doDel1', copy = strip(s);
      if (await write(async () => { if (re) await setSizes(s.productId, sz => bumpSize(sz, s.size, s.qty || 1)); await db.doc('sales/' + id).delete(); }, 'Venta borrada',
        () => write(async () => { if (re) await setSizes(s.productId, sz => bumpSize(sz, s.size, -(s.qty || 1))); await db.doc('sales/' + id).set(copy); }, 'Venta recuperada'))) closeSheet(); break; }
    // gastos
    case 'newExpense': expenseForm(); break;
    case 'newBuy': expenseForm(null, 'pedido'); break;
    case 'newGasto': expenseForm(null, 'otros'); break;
    // inicio rápido
    case 'qReturn': returnPicker(); break;
    case 'pickReturn': returnSheet(id); break;
    case 'qStock': stockPicker(); break;
    case 'pickStock': addUnitsForm(id); break;
    case 'enterApp': enterApp(); break;
    case 'quickOn': S.quick = true; S.animate = true; closeSheet(); render(); window.scrollTo(0, 0); break;
    case 'quickPref': store.set('quickStart', b.dataset.v); moreSheet(); break;
    case 'expense': expenseDetail(id); break;
    case 'editExpense': expenseForm(S.expenses.find(x => x.id === id)); break;
    case 'delExpense': { const e = S.expenses.find(x => x.id === id); if (!e) break; const copy = strip(e);
      if (await write(() => db.doc('expenses/' + id).delete(), 'Gasto borrado', () => write(() => db.doc('expenses/' + id).set(copy), 'Recuperado'))) closeSheet(); break; }
    // entradas
    case 'entry': entryDetail(id); break;
    case 'undoEntry': { const m = S.stockmoves.find(x => x.id === id); if (!m) break; const copy = strip(m);
      if (await write(async () => { await setSizes(m.productId, sz => (m.sizes || []).forEach(s => bumpSize(sz, s.s, -s.q))); await db.doc('stockmoves/' + id).delete(); }, 'Entrada deshecha',
        () => write(async () => { await setSizes(m.productId, sz => (m.sizes || []).forEach(s => bumpSize(sz, s.s, s.q))); await db.doc('stockmoves/' + id).set(copy); }, 'Entrada recuperada'))) closeSheet(); break; }
    // móviles
    case 'account': openAccount(id); break;
    case 'accMenu': accountSheet(id); break;
    case 'blockAcc': blockSheet(id); break;
    case 'accBack': S.accView = ''; S.animate = true; render(); window.scrollTo(0, 0); break;
    case 'accP': S.accP = b.dataset.v; S.accOff = 0; S.animate = true; haptic(1); render(); break;
    case 'accOff': S.accOff = Math.min(0, S.accOff + +b.dataset.d); S.animate = true; haptic(1); render(); break;
    case 'accAllMovs': S.movAcc = id; S.movF = 'all'; S.movQ = ''; go('movs'); break;
    case 'newAccount': accountForm(); break;
    case 'editAccount': accountForm(acc(id)); break;
    case 'renameAccount': renameSheet(id, b.dataset.back === '1'); break;
    case 'accFilter': S.accFilter = b.dataset.v; render(); break;
    case 'setWarm': { const v = b.dataset.v === '1'; if (await write(() => db.doc('accounts/' + id).update({ warm: v }), v ? 'Cuenta calentada' : 'Cuenta sin calentar')) setTimeout(() => accountSheet(id), 120); break; }
    case 'askDelAccount': delAccountSheet(id); break;
    case 'delAccount': { const x = acc(id); if (!x) break; const copy = strip(x), ss = S.sales.filter(s => s.account === id), ps = S.products.filter(p => p.account === id);
      if (await write(async () => { for (const s of ss) await db.doc('sales/' + s.id).update({ accountName: x.name }); for (const p of ps) await db.doc('products/' + p.id).update({ account: '' }); await db.doc('accounts/' + id).delete(); },
        'Móvil borrado', () => write(async () => { await db.doc('accounts/' + id).set(copy); for (const p of ps) await db.doc('products/' + p.id).update({ account: id }); }, 'Móvil recuperado'))) closeSheet(); break; }
    case 'copyIban': { const x = acc(id); if (!x || !x.iban) break; const t = ibanFmt(x.iban); navigator.clipboard.writeText(t).then(() => toast('IBAN copiado'), () => toast(t)); break; }
    case 'export': exportCsv(b.dataset.what); break;
    case 'clearDemo': if (armed(b, '¿Seguro?')) await write(async () => { for (const c of COLLS) for (const x of S[c].filter(x => x.demo)) await db.doc(c + '/' + x.id).delete(); }, 'Ejemplos borrados'); break;
  }
});
document.addEventListener('submit', ev => { ev.preventDefault(); if (onSubmit && ev.target.closest('#sheetBody')) onSubmit(new FormData(ev.target), ev.submitter && ev.submitter.dataset.again); });
document.addEventListener('input', ev => {
  if (ev.target.id === 'q-stock') { S.stockQ = ev.target.value; $('#stockList').innerHTML = stockList(); }
  if (ev.target.id === 'q-mov') { S.movQ = ev.target.value; $('#movList').innerHTML = movList(); }
  if (ev.target.id === 'q-ret') { S.retQ = ev.target.value; $('#retList').innerHTML = retList(); }
  if (ev.target.id === 'q-sk') { S.skQ = ev.target.value; $('#skList').innerHTML = skList(); }
});
/* en la pantalla de botones, deslizar hacia arriba entra a la app */
let swY = null, swX = 0;
document.addEventListener('touchstart', e => { swY = S.quick && !$('#sheet').classList.contains('show') ? e.touches[0].clientY : null; swX = e.touches[0].clientX; }, { passive: true });
document.addEventListener('touchend', e => { if (swY === null) return; const t = e.changedTouches[0], dy = t.clientY - swY, dx = t.clientX - swX; swY = null;
  if (dy < -80 && Math.abs(dx) < 70 && innerHeight + scrollY >= document.documentElement.scrollHeight - 8) enterApp(); }, { passive: true });
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') closeSheet(); });

/* ---------- arranque ---------- */
applyLook();
const DESK = matchMedia('(min-width: 1000px)');
S.desk = DESK.matches;
S.quick = !S.desk && (store.get('quickStart') || '1') === '1';
try { DESK.addEventListener('change', () => { S.desk = DESK.matches; S.animate = true; render(); }); } catch (e) {}
document.querySelectorAll('[data-ic]').forEach(el => el.insertAdjacentHTML('afterbegin', ic(el.dataset.ic)));
window.S = S; window.loadedAll = loadedAll;
render();
(async () => {
  db = window.claude ? await window.claude.use('db') : null;
  if (!db) { S.error = 'Falta conectar la base de datos. Revisa config.js y el README.'; render(); return; }
  const fail = e => { S.error = e && e.code === 'revoked' ? 'Ya no tienes acceso a estos datos.' : 'Se perdió la conexión. Recarga la página.'; render(); };
  let rt; const later = () => { clearTimeout(rt); rt = setTimeout(() => { render(); if (catRefresh) catRefresh(); }, 30); };
  COLLS.forEach(c => db.collection(c).onSnapshot(s => { S[c] = s.docs.map(d => ({ id: d.id, ...d.data() })); const first = !loadedAll(); S.loaded[c] = true; if (first && loadedAll()) S.animate = true; later(); }, fail));
  [downloads, assets] = await Promise.all([window.claude.use('downloads'), window.claude.use('assets')]);
  render();
})();
</script>
