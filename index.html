<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0D0E11"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Reventa"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="icon" type="image/png" href="icons/icon-192.png"></head><body>
<title>Libro de Reventa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: centro de negocio siguiendo la guía «diseno-apps»: una columna de 520px, tarjeta protagonista con degradado de acento,
   tarjetas con borde fino y sombra larga, barra inferior pegada con indicador deslizante y «+» central.
   Helvetica. Oscuro y claro (automático por defecto). Series de gráficas en orden fijo validado: s1 azul, s2 naranja, s3 aqua, s4 amarillo, s5 magenta. */
:root {
  --bg: #0E0E10; --card: #1A1A1C; --card2: #232325;
  --ink: #F3F1EC; --ink2: #9C9994; --ink3: #6B6863;
  --hair: rgba(255, 255, 255, .07);
  --accent: #D8B978; --on-accent: #171512;
  --pos: #9CC48A; --neg: #E0675C; --warn: #E0A84E;
  --c1: #7C93B3; --c2: #B08BBB; --c3: #C97B63; --c4: #6FA8A3; --c5: #9CAF88; --mute: #4A4843;
  --tabbar: rgba(20, 19, 18, .82);
  --lift: 0 1px 0 rgba(255, 255, 255, .045) inset, 0 14px 30px -20px rgba(0, 0, 0, .85);
  --toast: #26262A; --toast-ink: #F3F1EC;
  --r-sm: 12px; --r-md: 16px; --r-lg: 20px; --r-xl: 24px; --r-2xl: 28px;
  --ctl: 46px; --ctl-lg: 54px; --maxw: 520px;
  --ease-out: cubic-bezier(.2, .8, .2, 1); --ease-sheet: cubic-bezier(.32, .72, 0, 1);
  --font: "Inter", "Helvetica Neue", Helvetica, -apple-system, Arial, sans-serif;
  color-scheme: dark;
}
body.light {
  --bg: #FAF7F1; --card: #FFFFFF; --card2: #F1ECE2;
  --ink: #221F1A; --ink2: #7A7469; --ink3: #A39B8E;
  --hair: rgba(34, 31, 26, .09);
  --accent: #B8914A; --on-accent: #FFFFFF;
  --pos: #4E7A3E; --neg: #B0473E; --warn: #A86A12;
  --c1: #5F7BA3; --c2: #9C6FA9; --c3: #B8654C; --c4: #4E8E89; --c5: #7E9668; --mute: #D9D2C3;
  --tabbar: rgba(255, 255, 255, .86);
  --lift: 0 1px 2px rgba(40, 30, 10, .05), 0 12px 26px -18px rgba(40, 30, 10, .25);
  --toast: #26262A; --toast-ink: #F3F1EC;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15.5px; line-height: 1.45; -webkit-font-smoothing: antialiased; transition: background .3s; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; -webkit-user-select: none; user-select: none; }
button:active:not(:disabled) { transform: scale(.96); transition: transform .1s; }
button:disabled { cursor: default; opacity: .4; }
input, select { font-size: 16px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
img { display: block; }
svg.i { width: 20px; height: 20px; flex: none; }
.tn { font-variant-numeric: tabular-nums; }
.pos { color: var(--pos); } .neg { color: var(--neg); } .mut { color: var(--ink2); }

.screen { max-width: var(--maxw); margin: 0 auto; padding-inline: 16px; padding-block: 10px calc(110px + env(safe-area-inset-bottom, 0px)); }
.view { display: flex; flex-direction: column; gap: 12px; }
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin: 6px 0 6px; }
.eyebrow { font-size: 14px; font-weight: 500; color: var(--ink2); }
.top h1 { margin: 2px 0 0; font-size: 32px; font-weight: 700; letter-spacing: -.035em; line-height: 1.05; }
.round { width: 44px; height: 44px; border-radius: var(--r-md); background: var(--card); border: 1px solid var(--hair); color: var(--ink2); display: grid; place-items: center; flex: none; box-shadow: var(--lift); }
.ctrl { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.mnav { display: flex; align-items: center; gap: 2px; background: var(--card2); border: 1px solid var(--hair); border-radius: var(--r-sm); padding: 4px; }
.mnav b { min-width: 104px; text-align: center; font-size: 14px; font-weight: 600; text-transform: capitalize; white-space: nowrap; }
.arr { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; color: var(--ink2); }
.arr svg.i { width: 18px; height: 18px; }

/* selector segmentado con fondo que se desliza */
.seg { position: relative; display: flex; padding: 4px; border-radius: var(--r-sm); background: var(--card2); border: 1px solid var(--hair); }
.seg button { position: relative; z-index: 1; min-height: 32px; padding: 0 14px; font-size: 13.5px; font-weight: 600; color: var(--ink2); display: inline-flex; align-items: center; gap: 6px; transition: color .2s; }
.seg button[aria-pressed="true"] { color: var(--ink); }
.seg button svg.i { width: 16px; height: 16px; }
.seg-ind { position: absolute; top: 4px; bottom: 4px; left: 0; width: 0; border-radius: 9px; background: var(--card); box-shadow: 0 4px 12px -4px rgba(0, 0, 0, .35); transition: transform .3s var(--ease-out), width .3s var(--ease-out); }

.demo { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 10px 10px 14px; border-radius: var(--r-md); background: color-mix(in srgb, var(--warn) 13%, transparent); border: 1px solid color-mix(in srgb, var(--warn) 25%, transparent); color: var(--warn); font-size: 13.5px; font-weight: 600; margin-bottom: 10px; }
.demo button { background: var(--warn); color: var(--bg); border-radius: 9px; padding: 7px 12px; font-size: 13px; font-weight: 700; flex: none; }

/* tarjeta protagonista */
.hero { border-radius: var(--r-2xl); padding: 22px; position: relative; overflow: hidden; color: var(--ink);
  background: linear-gradient(160deg, color-mix(in srgb, var(--accent) 22%, var(--card)), var(--card)); border: 1px solid var(--hair); box-shadow: var(--lift); }
.hero::after { content: ''; position: absolute; width: 220px; height: 220px; border-radius: 50%; right: -80px; top: -100px; background: color-mix(in srgb, var(--accent) 18%, transparent); pointer-events: none; }
.hero > * { position: relative; z-index: 1; }
.hero-l { font-size: 14px; font-weight: 500; color: var(--ink2); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.big { font-size: clamp(36px, 11vw, 44px); font-weight: 700; letter-spacing: -.035em; line-height: 1.05; font-variant-numeric: tabular-nums; margin-top: 6px; }
.big .c, .bigv .c { font-size: .55em; color: var(--ink3); letter-spacing: -.02em; }
.big.neg { color: var(--neg); }
.hero-s { font-size: 13px; color: var(--ink2); margin-top: 4px; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; }
.tile { background: color-mix(in srgb, var(--card2) 80%, transparent); border-radius: var(--r-md); padding: 10px 12px; min-width: 0; }
.tile span { display: flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--ink2); font-weight: 500; }
.tile span svg.i { width: 13px; height: 13px; }
.tile b { display: block; font-size: 16px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.spark { display: block; width: 100%; height: 38px; margin-top: 12px; }
.delta { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 8px; background: var(--card2); color: var(--ink2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.delta.up { color: var(--pos); background: color-mix(in srgb, var(--pos) 14%, transparent); }
.delta.down { color: var(--neg); background: color-mix(in srgb, var(--neg) 14%, transparent); }

.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.kpi { background: var(--card); border: 1px solid var(--hair); border-radius: var(--r-xl); box-shadow: var(--lift); padding: 14px 14px 10px; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.kpi-l { font-size: 12.5px; font-weight: 500; color: var(--ink2); display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.kpi-l > span { display: inline-flex; align-items: center; gap: 6px; }
.kpi-l svg.i { width: 15px; height: 15px; }
.kpi-v { font-size: 22px; font-weight: 700; letter-spacing: -.03em; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 4px; }
.kpi .spark { height: 30px; margin-top: 6px; }
.kpi small { font-size: 12px; color: var(--ink2); }

.card { background: var(--card); border: 1px solid var(--hair); border-radius: var(--r-xl); box-shadow: var(--lift); padding: 18px; min-width: 0; }
.ch { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 14px; }
.ch h2 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: -.01em; }
.ch p { margin: 2px 0 0; font-size: 12.5px; color: var(--ink2); }
.ch .lnk { font-size: 13px; font-weight: 600; color: var(--accent); display: inline-flex; align-items: center; gap: 2px; }
.ch .lnk svg.i { width: 15px; height: 15px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--ink2); font-weight: 500; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 10px; height: 10px; border-radius: 3px; flex: none; display: inline-block; }
.chart { display: block; width: 100%; overflow: visible; }
.chart text { font-family: var(--font); font-size: 10.5px; font-weight: 500; font-variant-numeric: tabular-nums; }
.hbar { display: flex; flex-direction: column; gap: 14px; }
.hrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 5px 10px; align-items: center; width: 100%; }
.hrow .nm { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hrow .vl { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
.hrow .tr { grid-column: 1 / -1; height: 8px; border-radius: 6px; background: var(--card2); overflow: hidden; }
.hrow .tr i { display: block; height: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 60%, white)); width: 0; transition: width .8s var(--ease-out); }
.hrow .sb { grid-column: 1 / -1; font-size: 12px; color: var(--ink2); margin-top: -2px; }
.donut-w { display: grid; grid-template-columns: 132px minmax(0, 1fr); gap: 18px; align-items: center; }
.dleg { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.dleg div { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 13.5px; }
.dleg span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.dleg b { font-variant-numeric: tabular-nums; font-weight: 700; }
.dleg small { color: var(--ink2); font-weight: 500; margin-left: 4px; }
.stat3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat3 div { background: var(--card2); border-radius: var(--r-md); padding: 10px 12px; min-width: 0; }
.stat3.out div { background: var(--card); border: 1px solid var(--hair); box-shadow: var(--lift); }
.stat3 span { display: block; font-size: 11.5px; color: var(--ink2); font-weight: 500; }
.stat3 b { font-size: 16px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; white-space: nowrap; }

#tip { position: fixed; z-index: 60; pointer-events: none; background: var(--toast); color: var(--toast-ink); padding: 8px 11px; border-radius: 11px; font-size: 12.5px; font-weight: 500; line-height: 1.5; box-shadow: 0 18px 40px -12px rgba(0, 0, 0, .6); opacity: 0; transform: translateY(4px); transition: opacity .12s, transform .12s; max-width: 220px; white-space: pre-line; font-variant-numeric: tabular-nums; }
#tip.show { opacity: 1; transform: none; }

/* listas */
.sec-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin: 16px 4px 0; }
.sec-h h2 { margin: 0; font-size: 12.5px; font-weight: 600; color: var(--ink2); text-transform: uppercase; letter-spacing: .06em; }
.sec-h span, .sec-h button { font-size: 13px; color: var(--ink2); font-weight: 500; }
.list { display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--hair); border-radius: var(--r-xl); padding: 4px 14px; box-shadow: var(--lift); }
.row { display: flex; align-items: center; gap: 12px; padding: 11px 0; width: 100%; text-align: left; }
.list > .row + .row { border-top: 1px solid var(--hair); }
button.row:active { transform: none; opacity: .65; }
.th { width: 42px; height: 42px; border-radius: 13px; flex: none; overflow: hidden; display: grid; place-items: center; background: var(--card2); }
.th img { width: 100%; height: 100%; object-fit: cover; }
.th svg.i { width: 20px; height: 20px; }
.rm { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.rt { font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; letter-spacing: -.01em; }
.rs { font-size: 12.5px; color: var(--ink2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rv { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; flex: none; font-variant-numeric: tabular-nums; }
.rv b { font-size: 15px; font-weight: 700; letter-spacing: -.01em; }
.rv small { font-size: 11.5px; color: var(--ink2); font-weight: 500; }
.struck { text-decoration: line-through; color: var(--ink3) !important; }
.chev { width: 16px !important; height: 16px !important; color: var(--ink3); flex: none; }
.tag { display: inline-flex; align-items: center; height: 19px; padding: 0 7px; border-radius: 6px; font-size: 11px; font-weight: 700; vertical-align: 1px; background: var(--card2); color: var(--ink2); }
.tag.neg { background: color-mix(in srgb, var(--neg) 15%, transparent); color: var(--neg); }
.day { font-size: 12.5px; font-weight: 600; color: var(--ink2); padding: 14px 6px 6px; display: flex; justify-content: space-between; text-transform: uppercase; letter-spacing: .05em; }
.day span:last-child { text-transform: none; letter-spacing: 0; font-variant-numeric: tabular-nums; }

/* stock en cuadrícula */
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pc { background: var(--card); border: 1px solid var(--hair); border-radius: var(--r-xl); overflow: hidden; box-shadow: var(--lift); text-align: left; display: flex; flex-direction: column; min-width: 0; }
.pc-img { aspect-ratio: 1 / 1; width: 100%; max-width: 100%; background: var(--card2); display: grid; place-items: center; position: relative; }
.pc-img img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }
.pc-img svg.i { width: 34%; height: 34%; stroke-width: 1.4; }
.pc-qty { position: absolute; top: 8px; right: 8px; background: rgba(14, 14, 16, .6); color: #fff; font-size: 11.5px; font-weight: 700; padding: 3px 8px; border-radius: 8px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.pc-qty.zero { background: var(--neg); }
.pc-b { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.pc-n { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; letter-spacing: -.01em; }
.pc-p { font-size: 12.5px; color: var(--ink2); font-variant-numeric: tabular-nums; }
.pc-p b { color: var(--ink); font-weight: 700; }
.sizes { display: flex; flex-wrap: wrap; gap: 4px; }
.sz { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: var(--card2); color: var(--ink); font-variant-numeric: tabular-nums; }
.sz em { font-style: normal; color: var(--ink2); font-weight: 500; margin-left: 2px; }

.search { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--hair); border-radius: var(--r-md); padding-inline: 14px; height: var(--ctl); }
.search:focus-within { border-color: color-mix(in srgb, var(--accent) 60%, transparent); }
.search svg.i { width: 18px; height: 18px; color: var(--ink3); }
.search input { border: 0; background: transparent; outline: none; width: 100%; min-width: 0; }
.search input::placeholder { color: var(--ink3); }
.scroll-x { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding-inline: 16px; }
.scroll-x::-webkit-scrollbar { display: none; }
.pill { flex: none; height: 34px; padding: 0 14px; border-radius: 11px; font-size: 13.5px; font-weight: 600; color: var(--ink2); background: var(--card2); border: 1px solid var(--hair); white-space: nowrap; }
.pill[aria-pressed="true"] { background: color-mix(in srgb, var(--accent) 18%, var(--card)); color: var(--ink); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: var(--ctl); padding: 0 18px; border-radius: var(--r-sm); border: 1px solid transparent; font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
.btn svg.i { width: 18px; height: 18px; }
.btn-main { background: var(--accent); color: var(--on-accent); }
.btn-soft { background: var(--card2); border-color: var(--hair); color: var(--ink); }
.btn-danger { background: color-mix(in srgb, var(--neg) 12%, transparent); color: var(--neg); }
.btn-block { width: 100%; min-height: var(--ctl-lg); border-radius: var(--r-md); font-size: 16px; }
.btn-sm { min-height: 38px; padding: 0 14px; font-size: 14px; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btns .btn { flex: 1 1 0; padding: 0 10px; min-width: 0; }
.qbtn { flex: none; display: inline-flex; align-items: center; height: 32px; padding: 0 12px; border-radius: 10px; font-size: 13px; font-weight: 600; background: var(--accent); color: var(--on-accent); }

.empty { text-align: center; padding: 32px 20px; border: 1.5px dashed var(--hair); border-radius: var(--r-xl); color: var(--ink2); }
.empty .th { margin: 0 auto 12px; width: 56px; height: 56px; border-radius: 18px; background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
.empty .th svg.i { width: 26px; height: 26px; }
.empty b { display: block; color: var(--ink); font-size: 16px; margin-bottom: 4px; }
.empty p { margin: 0 auto; max-width: 32ch; font-size: 14px; }
.empty .btn { margin-top: 16px; }
.skel { height: 100px; border-radius: var(--r-xl); background: linear-gradient(90deg, var(--card2) 0%, color-mix(in srgb, var(--card2) 70%, var(--ink) 6%) 50%, var(--card2) 100%); background-size: 200% 100%; animation: skel 1.2s ease-in-out infinite; }
@keyframes skel { from { background-position: 200% 0 } to { background-position: -200% 0 } }

/* menú inferior pegado al borde, con «+» central */
.tabbar { --pad: max(8px, calc(env(safe-area-inset-bottom, 0px) - 12px)); --side: max(10px, calc((100% - 500px) / 2));
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: grid; grid-template-columns: repeat(5, 1fr); align-items: center;
  padding: 6px var(--side) var(--pad); border-radius: 24px 24px 0 0; border-top: 1px solid var(--hair);
  background: var(--tabbar); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); box-shadow: 0 -10px 30px -18px rgba(0, 0, 0, .45); }
.tab { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--ink3); font-size: 10.5px; font-weight: 600; padding: 8px 2px; transition: color .2s; }
.tab svg.i { width: 22px; height: 22px; }
.tab.on { color: var(--accent); }
.tab-ind { position: absolute; top: 6px; bottom: var(--pad); left: 0; width: 0; border-radius: 20px; background: color-mix(in srgb, var(--accent) 16%, transparent); transition: transform .32s var(--ease-out), opacity .2s; opacity: 0; }
.fab { justify-self: center; width: 56px; height: 56px; margin-top: -24px; border-radius: 20px; position: relative; z-index: 2; display: grid; place-items: center; color: var(--on-accent);
  background: linear-gradient(140deg, color-mix(in srgb, var(--accent) 60%, white), var(--accent) 50%, color-mix(in srgb, var(--accent) 75%, black));
  box-shadow: 0 12px 24px -8px color-mix(in srgb, var(--accent) 60%, transparent), 0 1px 0 rgba(255, 255, 255, .45) inset; }
.fab svg.i { width: 26px; height: 26px; stroke-width: 2.2; }

/* hoja que sube desde abajo */
.backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, .45); opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 29; }
.backdrop.show { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; max-width: var(--maxw); margin: 0 auto; max-height: 92%; overflow-y: auto; overscroll-behavior: contain;
  background: var(--bg); border-radius: 28px 28px 0 0; padding: 8px 20px calc(22px + env(safe-area-inset-bottom, 0px)); transform: translateY(110%); visibility: hidden; transition: transform .36s var(--ease-sheet), visibility 0s .36s; }
.sheet.show { transform: none; visibility: visible; transition: transform .36s var(--ease-sheet); }
.grab { width: 38px; height: 5px; border-radius: 3px; background: var(--ink3); opacity: .4; margin: 6px auto 14px; }
.sh { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.sh h2 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -.03em; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.x { width: 34px; height: 34px; border-radius: 50%; background: var(--card2); color: var(--ink2); display: grid; place-items: center; flex: none; }
.x svg.i { width: 16px; height: 16px; }
.sbody { display: flex; flex-direction: column; gap: 14px; }
.choice { display: flex; align-items: center; gap: 14px; padding: 14px; background: var(--card); border: 1px solid var(--hair); border-radius: var(--r-lg); text-align: left; width: 100%; box-shadow: var(--lift); }
.choice b { display: block; font-size: 16px; font-weight: 700; letter-spacing: -.01em; }
.choice span { font-size: 13px; color: var(--ink2); }
.choices { display: flex; flex-direction: column; gap: 8px; }

form.f { display: flex; flex-direction: column; gap: 14px; }
.amount-w { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 4px 0; }
.amount-w label { font-size: 13px; color: var(--ink2); font-weight: 500; }
.amount { display: flex; align-items: baseline; justify-content: center; gap: 4px; font-size: 50px; font-weight: 700; letter-spacing: -.04em; line-height: 1.1; }
.amount input { border: 0; background: transparent; outline: none; text-align: right; font-size: inherit; font-weight: 700; letter-spacing: -.04em; width: 1.6ch; min-width: 1ch; max-width: 7ch; padding: 0; font-variant-numeric: tabular-nums; caret-color: var(--accent); }
.amount input::placeholder { color: var(--ink3); }
.amount span { color: var(--ink3); }
.fld { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.fld > label, .lbl { font-size: 12.5px; color: var(--ink2); font-weight: 600; }
.fld input, .fld select, .inp { min-height: var(--ctl); height: var(--ctl); border-radius: var(--r-sm); border: 1px solid var(--hair); background: var(--card2); padding: 0 12px; width: 100%; min-width: 0; outline: none; font-variant-numeric: tabular-nums; color: var(--ink); }
.fld input:focus, .fld select:focus, .inp:focus { border-color: color-mix(in srgb, var(--accent) 60%, transparent); }
.fld input::placeholder, .inp::placeholder { color: var(--ink3); }
.mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace !important; letter-spacing: .03em; text-transform: uppercase; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips label { position: relative; }
.chips input { position: absolute; opacity: 0; pointer-events: none; }
.chips span { display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border-radius: var(--r-sm); background: var(--card2); border: 1px solid var(--hair); font-size: 14px; font-weight: 600; color: var(--ink2); cursor: pointer; transition: background .15s, color .15s; }
.chips span small { font-size: 11.5px; font-weight: 500; opacity: .75; }
.chips input:checked + span { background: color-mix(in srgb, var(--accent) 18%, var(--card)); color: var(--ink); border-color: color-mix(in srgb, var(--accent) 55%, transparent); }
.chips input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.hint { font-size: 12.5px; color: var(--ink2); margin: -4px 0 0; }
.picker { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin-inline: -20px; padding: 2px 20px 4px; }
.picker::-webkit-scrollbar { display: none; }
.pk { flex: none; width: 88px; text-align: left; display: flex; flex-direction: column; gap: 5px; }
.pk .pc-img { border-radius: var(--r-md); overflow: hidden; border: 1px solid var(--hair); }
.pk span { font-size: 12px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pk[aria-pressed="true"] .pc-img { border: 2px solid var(--accent); }
.stepper { display: inline-flex; align-items: center; gap: 4px; background: var(--card2); border: 1px solid var(--hair); border-radius: var(--r-sm); padding: 3px; flex: none; }
.stepper button { width: 32px; height: 32px; border-radius: 9px; background: var(--card); display: grid; place-items: center; color: var(--ink); }
.stepper button svg.i { width: 16px; height: 16px; }
.stepper b { min-width: 28px; text-align: center; font-variant-numeric: tabular-nums; font-size: 15px; }
.szrow { display: flex; align-items: center; gap: 8px; }
.szrow .inp { flex: 1; }
.quick { display: flex; flex-wrap: wrap; gap: 6px; }
.quick button { height: 32px; min-width: 40px; padding: 0 10px; border-radius: 9px; background: var(--card); border: 1px solid var(--hair); font-size: 13px; font-weight: 600; color: var(--ink2); }
.photo { position: relative; width: 100%; max-width: 100%; aspect-ratio: 4 / 3; border-radius: var(--r-xl); overflow: hidden; background: var(--card2); border: 1px solid var(--hair); display: grid; place-items: center; }
.photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.photo .ph { display: flex; flex-direction: column; align-items: center; gap: 8px; color: var(--ink2); font-size: 14px; font-weight: 600; }
.photo .ph svg.i { width: 34px; height: 34px; stroke-width: 1.5; }
.photo .chg { position: absolute; right: 10px; bottom: 10px; display: inline-flex; align-items: center; gap: 6px; background: rgba(14, 14, 16, .6); color: #fff; padding: 7px 11px; border-radius: 10px; font-size: 13px; font-weight: 600; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.photo .chg svg.i { width: 15px; height: 15px; }
.facts { background: var(--card); border: 1px solid var(--hair); border-radius: var(--r-xl); padding: 2px 16px; box-shadow: var(--lift); }
.fact { display: flex; justify-content: space-between; align-items: center; gap: 14px; padding: 12px 0; font-size: 14.5px; }
.fact + .fact { border-top: 1px solid var(--hair); }
.fact > span { color: var(--ink2); }
.fact b { font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.dh { display: flex; align-items: center; gap: 14px; }
.dh .th { width: 60px; height: 60px; border-radius: 18px; }
.dh .th svg.i { width: 26px; height: 26px; }
.dh h3 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -.02em; line-height: 1.2; }
.dh p { margin: 3px 0 0; color: var(--ink2); font-size: 13.5px; }
.bigv { font-size: 38px; font-weight: 700; letter-spacing: -.035em; font-variant-numeric: tabular-nums; line-height: 1.05; }
.copy { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 11px; border-radius: 9px; background: var(--card2); border: 1px solid var(--hair); font-size: 13px; font-weight: 600; flex: none; }
.copy svg.i { width: 14px; height: 14px; }
.iban { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; letter-spacing: .02em; }
.missing { color: var(--warn); font-weight: 600; }
.prog { height: 8px; border-radius: 6px; background: var(--card2); overflow: hidden; }
.prog i { display: block; height: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--pos), color-mix(in srgb, var(--pos) 60%, white)); }
.prog.warn i { background: var(--warn); } .prog.neg i { background: var(--neg); }
.limit-s { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; color: var(--ink2); margin-top: 6px; }
.phone-c { display: flex; flex-direction: column; gap: 12px; width: 100%; text-align: left; }
.phone-c:active { transform: scale(.985) !important; }
.ph-h { display: flex; align-items: center; gap: 12px; }
.ph-av { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; font-weight: 700; font-size: 16px; flex: none; }

.toast { position: fixed; left: 50%; bottom: calc(100px + env(safe-area-inset-bottom, 0px)); z-index: 40; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; display: flex; align-items: center; gap: 18px;
  padding: 13px 18px; border-radius: 18px; overflow: hidden; background: var(--toast); color: var(--toast-ink); font-weight: 600; font-size: 14.5px; max-width: calc(100% - 32px); width: max-content; box-shadow: 0 18px 40px -12px rgba(0, 0, 0, .6); transition: opacity .25s, transform .3s var(--ease-out); }
.toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast button { color: var(--accent); font-weight: 700; flex: none; }

@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes shake { 0%, 100% { transform: none } 25% { transform: translateX(-6px) } 75% { transform: translateX(6px) } }
.enter > * { animation: rise .45s var(--ease-out) both; }
.enter > *:nth-child(2) { animation-delay: 40ms } .enter > *:nth-child(3) { animation-delay: 80ms } .enter > *:nth-child(4) { animation-delay: 120ms } .enter > *:nth-child(n+5) { animation-delay: 160ms }
.shake { animation: shake .3s; }
.grow { transform-box: fill-box; transform-origin: bottom; animation: grow .6s var(--ease-out) both; }
@keyframes grow { from { transform: scaleY(0); } to { transform: none; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; transition-duration: .01ms !important; } }
.qa { display: grid; grid-template-columns: 1.5fr 1fr; gap: 10px; }
.qa .btn { min-height: 54px; border-radius: var(--r-md); font-size: 15.5px; }
.sec-h h2 { font-size: 12.5px; }

/* ===== Por móvil, stock en filas y movimientos filtrables ===== */
.split { display: flex; gap: 3px; height: 14px; border-radius: 8px; overflow: hidden; background: var(--card2); border: 1px solid var(--bd); box-shadow: inset 0 1px 3px rgba(0, 0, 0, .3); padding: 2px; }
.split i { display: block; min-width: 6px; border-radius: 5px; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35); }
.mrows { display: flex; flex-direction: column; margin-top: 8px; }
.mrow { display: flex; align-items: center; gap: 12px; padding: 11px 0; width: 100%; text-align: left; }
.mrow + .mrow { border-top: 1px solid var(--bd); }
.mrow:active { opacity: .6; transform: none; }
.mav { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 15px; flex: none; border: 1px solid var(--bd); box-shadow: inset 0 1px 0 var(--hl); }
.mamt { font-size: 16px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.sumline { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 13px; color: var(--ink2); padding: 2px 4px 0; }
.sumline b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.sumline b.pos { color: var(--pos); }
.grp { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--ink2); font-weight: 600; padding: 18px 4px 8px; }
.grp span:first-child { display: inline-flex; align-items: center; gap: 8px; color: var(--ink); font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
.grp .sw { width: 9px; height: 9px; }
.plist { display: flex; flex-direction: column; gap: 10px; }
.pr { display: flex; align-items: stretch; gap: 8px; padding: 10px 12px 10px 10px; border-radius: var(--r-xl); background: linear-gradient(180deg, var(--card-hi), var(--card-lo)); border: 1px solid var(--bd); box-shadow: var(--depth); }
.pr-main { flex: 1; min-width: 0; display: flex; gap: 14px; text-align: left; align-items: center; }
.pr-main:active { transform: none; opacity: .65; }
.pr-img { width: 78px; height: 78px; border-radius: 16px; flex: none; position: relative; overflow: hidden; display: grid; place-items: center; border: 1px solid var(--bd); box-shadow: inset 0 1px 0 var(--hl); }
.pr-img img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.pr-img svg.i { width: 30px; height: 30px; stroke-width: 1.4; }
.pr-b { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.pr-n { font-size: 15.5px; font-weight: 600; letter-spacing: -.015em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pr-p { display: flex; align-items: baseline; gap: 8px; font-size: 13px; color: var(--ink2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.pr-p b { color: var(--ink); font-size: 15px; font-weight: 700; }
.pr-p em { font-style: normal; font-size: 12px; font-weight: 600; }
.pr-t { display: flex; }
.pr-r { display: flex; flex-direction: column; align-items: flex-end; justify-content: space-between; gap: 8px; flex: none; padding-left: 4px; }
.pr-u { display: flex; align-items: baseline; gap: 3px; }
.pr-u b { font-size: 26px; font-weight: 700; letter-spacing: -.04em; font-variant-numeric: tabular-nums; line-height: 1; }
.pr-u span { font-size: 12px; color: var(--ink2); font-weight: 500; }
.pr-u.zero b { color: var(--neg); }
.qbtn.soft { background: linear-gradient(180deg, var(--card-hi), var(--card2)); color: var(--ink); border: 1px solid var(--bd2); box-shadow: inset 0 1px 0 var(--hl); }
.tag.warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); }

/* ===== Estilo profesional: grafito, esquinas contenidas, planos con borde fino; el dorado solo como detalle ===== */
:root {
  --bg: #0B0C0E; --card: #13151A; --card2: #1B1E24; --card-hi: #13151A; --card-lo: #13151A;
  --ink: #ECEEF1; --ink2: #8B919C; --ink3: #555B66;
  --hair: rgba(255, 255, 255, .08); --bd: rgba(255, 255, 255, .1); --bd2: rgba(255, 255, 255, .17); --hl: transparent;
  --accent: #BFA970; --on-accent: #14120C;
  --pos: #6FBF8F; --neg: #D96B62; --warn: #D9A441; --mute: #3A3E47;
  --c1: #7C8FAE; --c2: #A28DB0; --c3: #BE7E6B; --c4: #6FA29E; --c5: #8CA47A;
  --tabbar: rgba(11, 12, 14, .88); --toast: #23262D; --toast-ink: #ECEEF1;
  --depth: none; --depth-sm: none; --glow: none;
  --r-sm: 8px; --r-md: 10px; --r-lg: 12px; --r-xl: 14px; --r-2xl: 16px;
}
body.light {
  --bg: #F3F4F6; --card: #FFFFFF; --card2: #ECEEF1; --card-hi: #FFFFFF; --card-lo: #FFFFFF;
  --ink: #14161A; --ink2: #666C77; --ink3: #A4A9B2;
  --hair: rgba(20, 22, 26, .09); --bd: rgba(20, 22, 26, .12); --bd2: rgba(20, 22, 26, .2); --hl: transparent;
  --accent: #8C7843; --on-accent: #FFFFFF;
  --pos: #2E8A57; --neg: #C4443B; --warn: #A8700F; --mute: #CBCFD6;
  --c1: #5E7699; --c2: #8A6F9B; --c3: #AE6650; --c4: #4D8A86; --c5: #6E8A5A;
  --tabbar: rgba(243, 244, 246, .9); --toast: #1B1E24; --toast-ink: #ECEEF1;
}
body { background: var(--bg); }
.card, .kpi, .list, .facts, .stat3, .choice, .phone-c, .pr, .photo, .alert, .skel {
  background: var(--card); border: 1px solid var(--bd); box-shadow: none; border-radius: var(--r-xl);
}
body.light .card, body.light .list, body.light .facts, body.light .stat3, body.light .choice, body.light .phone-c, body.light .pr, body.light .alert { box-shadow: 0 1px 2px rgba(20, 22, 26, .05); }
.list { padding: 2px 16px; }
.card .stat3 { background: var(--card2); box-shadow: none; }
.hero { background: var(--card); border: 1px solid var(--bd); border-top: 2px solid var(--accent); border-radius: var(--r-xl); box-shadow: none; padding: 20px; }
.hero::after { display: none; }
.big { font-weight: 600; letter-spacing: -.045em; font-size: clamp(38px, 11.5vw, 46px); }
.big .c { font-weight: 400; }
.tiles { gap: 0; margin-top: 18px; border-top: 1px solid var(--hair); }
.tile, .tiles .tile { background: transparent; border: 0; border-radius: 0; box-shadow: none; padding: 14px 0 0; }
.tiles .tile + .tile { border-left: 1px solid var(--hair); padding-left: 16px; }
.delta { border-radius: 5px; padding: 3px 7px; }
.delta.up { background: color-mix(in srgb, var(--pos) 13%, transparent); } .delta.down { background: color-mix(in srgb, var(--neg) 13%, transparent); }
/* botones planos */
.btn { border-radius: var(--r-sm); font-weight: 600; letter-spacing: -.005em; }
.btn-main { background: var(--ink); color: var(--bg); border: 0; box-shadow: none; }
.btn-soft { background: var(--card2); color: var(--ink); border: 1px solid var(--bd); box-shadow: none; }
.btn-danger { background: transparent; border: 1px solid color-mix(in srgb, var(--neg) 45%, transparent); color: var(--neg); }
.qa .btn { border-radius: var(--r-md); }
.qbtn { background: var(--ink); color: var(--bg); border: 0; border-radius: 7px; box-shadow: none; font-weight: 600; }
.qbtn.soft { background: var(--card2); color: var(--ink); border: 1px solid var(--bd); }
.fab { border-radius: 14px; background: var(--ink); color: var(--bg); border: 0; box-shadow: 0 0 0 5px var(--bg); }
.tabbar { border-radius: 0; background: var(--tabbar); border-top: 1px solid var(--bd); box-shadow: none; }
.tab-ind { display: none; }
.tab.on { color: var(--ink); }
.tab.on::after { content: ""; position: absolute; top: -7px; left: 28%; right: 28%; height: 2px; background: var(--accent); border-radius: 0 0 2px 2px; }
/* controles */
.pill, .chips span { border-radius: var(--r-sm); background: var(--card2); border: 1px solid var(--bd); box-shadow: none; color: var(--ink2); font-weight: 500; }
.pill[aria-pressed="true"], .chips input:checked + span { background: var(--ink); color: var(--bg); border-color: var(--ink); box-shadow: none; }
.seg { border-radius: 9px; background: var(--card2); border: 1px solid var(--bd); box-shadow: none; }
.seg-ind { border-radius: 6px; background: var(--card); border: 1px solid var(--bd2); box-shadow: none; }
body.light .seg-ind { background: #fff; }
.mnav, .round, .search, .x, .copy, .quick button { border-radius: var(--r-sm); box-shadow: none; }
.round { border-radius: var(--r-md); background: var(--card); }
.stepper { border-radius: var(--r-sm); box-shadow: none; } .stepper button { border-radius: 6px; box-shadow: none; }
.fld input, .fld select, .inp { border-radius: var(--r-sm); background: var(--card2); border: 1px solid var(--bd); box-shadow: none; }
.fld input:focus, .fld select:focus, .inp:focus { border-color: var(--ink2); box-shadow: none; }
.th, .mav, .pr-img { border-radius: var(--r-md); box-shadow: none; background-image: none; }
.th { background: var(--card2); }
.pc-img { border-radius: var(--r-md); }
.tag { border-radius: 5px; border: 0; }
.demo { border-radius: var(--r-md); box-shadow: none; }
.empty { border-radius: var(--r-xl); background: transparent; border: 1px dashed var(--bd2); }
.split { height: 10px; padding: 0; border: 0; border-radius: 5px; gap: 2px; box-shadow: none; }
.split i { border-radius: 3px; box-shadow: none; }
.prog { height: 6px; border: 0; border-radius: 3px; box-shadow: none; } .prog i { border-radius: 3px; }
.sheet { background: var(--bg); border: 1px solid var(--bd); border-bottom: 0; border-radius: 18px 18px 0 0; box-shadow: none; }
body.light .sheet { background: #fff; }
.toast { border-radius: var(--r-md); border: 1px solid var(--bd2); box-shadow: 0 10px 28px rgba(0, 0, 0, .35); }
.sec-h h2 { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink2); font-weight: 600; }
.missing { color: var(--ink2); font-weight: 500; }
/* estado de la cuenta: calentada / sin calentar */
.wb { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 6px; font-size: 12px; font-weight: 600; white-space: nowrap; flex: none; border: 1px solid; }
.wb::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.wb.ok { color: var(--pos); background: color-mix(in srgb, var(--pos) 12%, transparent); border-color: color-mix(in srgb, var(--pos) 35%, transparent); }
.wb.no { color: var(--warn); background: color-mix(in srgb, var(--warn) 12%, transparent); border-color: color-mix(in srgb, var(--warn) 35%, transparent); }
.wb.sm { height: 19px; font-size: 11px; padding: 0 7px; margin-left: 6px; vertical-align: 1px; }
.wd { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 7px; }
.wd.ok { background: var(--pos); } .wd.no { background: var(--warn); }
.warmsw { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--bd); border-radius: var(--r-md); overflow: hidden; background: var(--card2); }
.warmsw button { height: 48px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; color: var(--ink2); }
.warmsw button + button { border-left: 1px solid var(--bd); }
.warmsw button svg.i { width: 17px; height: 17px; }
.warmsw button.on.ok { background: color-mix(in srgb, var(--pos) 16%, var(--card)); color: var(--pos); }
.warmsw button.on.no { background: color-mix(in srgb, var(--warn) 16%, var(--card)); color: var(--warn); }
.alert { display: flex; align-items: center; gap: 12px; padding: 12px 14px; width: 100%; text-align: left; border-left: 3px solid var(--warn); }

const billed = (r, id) => sum(okSales().filter(s => inR(s.date, r) && (!id || s.account === id)), s => s.price);
const fac = r => sum(okSales().filter(s => inR(s.date, r)), s => s.price);
const gas = r => sum(S.expenses.filter(e => inR(e.date, r)), e => e.amount);
const thumbOf = x => x && x.photo ? `<img src="${BLOB_URL}${esc(x.photo)}" alt="" loading="lazy">` : `<span style="color:${catOf(x).color}">${catOf(x).g}</span>`;
const th = (x, extra) => `<span class="th" ${extra || ''}>${thumbOf(x)}</span>`;
const tint = c => `background:color-mix(in srgb, ${c} 16%, transparent);color:${c}`;
const splitC = s => { const i = s.lastIndexOf(','); return i > 0 ? s.slice(0, i) + `<span class="c">${s.slice(i)}</span>` : s; };
const sizesHtml = p => (p.sizes || []).filter(s => s.q > 0).map(s => `<span class="sz">${esc(s.s)}<em>×${s.q}</em></span>`).join('');

/* ---------- tema ---------- */
function applyLook() { const v = store.get('look') || 'auto'; document.body.classList.toggle('light', v === 'light' || (v === 'auto' && matchMedia('(prefers-color-scheme: light)').matches)); }
try { matchMedia('(prefers-color-scheme: light)').addEventListener('change', applyLook); } catch (e) {}

/* ---------- gráficas (SVG propio, con tooltip al tocar) ---------- */
function sparkline(vals, color) {
  const W = 120, H = 34, mx = Math.max(...vals, 1), mn = Math.min(...vals, 0), sp = (mx - mn) || 1;
  const pts = vals.map((v, i) => [vals.length < 2 ? W : i * (W / (vals.length - 1)), 4 + (mx - v) / sp * (H - 8)]);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const last = pts[pts.length - 1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><path d="${d} L${W} ${H} L0 ${H}Z" style="fill:${color};opacity:.12"/><path d="${d}" fill="none" style="stroke:${color}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${last[0]}" cy="${last[1]}" r="2.6" style="fill:${color}"/></svg>`;
}
// barras agrupadas: groups [{label, vals:[...], tip, cur}], series [{name,color}]
function barChart(groups, series, { H = 190, fmt = short, labelEvery = 1, noY = false, W = 340 } = {}) {
  const top = 14, bot = 22, left = noY ? 4 : 30, n = groups.length, k = series.length;
  const mx = Math.max(1, ...groups.flatMap(g => g.vals)), step = niceStep(mx / 3), ymax = Math.ceil(mx / step) * step;
  const y = v => top + (1 - v / ymax) * (H - top - bot), gw = (W - left) / n, bw = Math.max(3, Math.min(16, (gw * .7 - (k - 1) * 2) / k));
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">`;
  for (let v = 0; v <= ymax + 1e-9; v += step) s += `<line x1="${left}" x2="${W}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--hair)"/>${noY ? '' : `<text x="${left - 6}" y="${y(v) + 3.5}" text-anchor="end" style="fill:var(--ink3)">${fmt(v)}</text>`}`;
  groups.forEach((g, i) => {
    const gx = left + i * gw + (gw - (k * bw + (k - 1) * 2)) / 2;
    g.vals.forEach((v, j) => { const x = gx + j * (bw + 2), yy = y(Math.max(0, v)), h = Math.max(0, y(0) - yy);
      if (h > 0) s += `<path class="grow" style="fill:${series[j].color};animation-delay:${i * 25}ms" d="M${x} ${y(0)} V${yy + Math.min(4, h)} q0 -${Math.min(4, h)} ${Math.min(4, bw / 2)} -${Math.min(4, h)} H${x + bw - Math.min(4, bw / 2)} q${Math.min(4, bw / 2)} 0 ${Math.min(4, bw / 2)} ${Math.min(4, h)} V${y(0)} Z"/>`; });
    if (i % labelEvery === 0 || g.cur) s += `<text x="${left + i * gw + gw / 2}" y="${H - 5}" text-anchor="middle" style="fill:${g.cur ? 'var(--ink)' : 'var(--ink2)'}">${esc(g.label)}</text>`;
    s += `<rect x="${left + i * gw}" y="${top}" width="${gw}" height="${H - top - bot}" fill="transparent" data-tip="${esc(g.tip)}"/>`;
  });
  return s + '</svg>';
}
function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(Math.max(raw, 1)))), f = raw / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p; }
function donut(parts, center, sub) {
  const R = 54, C = 2 * Math.PI * R, tot = sum(parts, p => p.v) || 1, gap = parts.filter(p => p.v > 0).length > 1 ? 3 : 0;
  let acc0 = 0, s = `<svg viewBox="0 0 132 132" width="132" height="132" role="img"><circle cx="66" cy="66" r="${R}" fill="none" style="stroke:var(--card2)" stroke-width="14"/>`;
  parts.filter(p => p.v > 0).forEach(p => { const len = p.v / tot * C;
    s += `<circle cx="66" cy="66" r="${R}" fill="none" style="stroke:${p.color}" stroke-width="14" stroke-dasharray="${Math.max(0, len - gap)} ${C}" stroke-dashoffset="${-acc0}" transform="rotate(-90 66 66)" data-tip="${esc(p.tip)}"/>`; acc0 += len; });
  return s + `<text x="66" y="66" text-anchor="middle" style="fill:var(--ink);font-size:17px;font-weight:800">${esc(center)}</text><text x="66" y="83" text-anchor="middle" style="fill:var(--ink2);font-size:11px;font-weight:600">${esc(sub)}</text></svg>`;
}

/* ---------- piezas ---------- */
const empty = (glyph, t, p, btn) => `<div class="empty"><span class="th">${glyph}</span><b>${t}</b>${p ? `<p>${p}</p>` : ''}${btn || ''}</div>`;
const loading = () => S.error ? empty(G.coin, 'No se pueden cargar tus datos', esc(S.error)) : '<div class="skel"></div><div class="skel"></div><div class="skel"></div>';
function periodCtl() {
  return `<div class="ctrl"><div class="mnav"><button class="arr" data-action="off" data-d="-1" aria-label="Anterior">${G.left}</button><b>${periodName(S.off)}</b><button class="arr" data-action="off" data-d="1" aria-label="Siguiente" ${S.off >= 0 ? 'disabled' : ''}>${G.right}</button></div>
    <div class="seg" data-k="per" role="group" aria-label="Periodo"><button data-action="per" data-v="month" aria-pressed="${S.per === 'month'}">Mes</button><button data-action="per" data-v="year" aria-pressed="${S.per === 'year'}">Año</button></div></div>`;
}
function deltaChip(cur, prev, invert) {
  if (!prev && !cur) return '<span class="delta">—</span>';
  if (!prev) return '<span class="delta up">nuevo</span>';
  const p = Math.round((cur - prev) / Math.abs(prev) * 100), good = invert ? p <= 0 : p >= 0;
  return `<span class="delta ${p === 0 ? '' : good ? 'up' : 'down'}">${p > 0 ? '▲' : p < 0 ? '▼' : '='} ${Math.abs(p)}%</span>`;
}

/* ---------- PANEL ---------- */
/* único aviso de la app: stock bajo (menos de 15 unidades en total) */
function lowStockAlert() {
  const t = sum(S.products, units);
  if (!S.products.length || t >= 15) return '';
  return `<button class="alert" data-action="goStock" data-c="all"><span class="th" style="${tint('var(--ink2)')}">${G.box}</span><span class="rm"><span class="rt">Quedan ${t} ${t === 1 ? 'unidad' : 'unidades'} en stock</span><span class="rs">Menos de 15 unidades</span></span>${G.chev}</button>`;
}
/* facturación total de todos los meses y todos los móviles */
function totalCard() {
  const tot = r2(sum(okSales(), x => x.price));
  return `<section class="card totcard"><div><div class="tl">Facturación total</div><div class="tn2" id="totNum" data-to="${tot}">${splitC(money(tot))}</div></div><span class="th">${G.coin}</span></section>`;
}
function vPanel() {
  let h = `<header class="top"><h1>Panel</h1><div style="display:flex;gap:8px"><button class="round" data-action="quickOn" aria-label="Botones rápidos">${G.zap}</button><button class="round" data-action="more" aria-label="Ajustes">${G.dots}</button></div></header>` + periodCtl();
  if (!loadedAll() || S.error) return h + loading();
  const r = periodR(S.off), pr = periodR(S.off - 1);
  const F = fac(r), Gs = gas(r), B = r2(F - Gs), pB = r2(fac(pr) - gas(pr));
  const sl = okSales().filter(s => inR(s.date, r)), cnt = sl.length;
  const dB = B === pB ? '' : `<span class="delta ${B > pB ? 'up' : 'down'}">${B > pB ? '▲ +' : '▼ −'}${money0(Math.abs(B - pB))}</span>`;
  h += `<section class="hero"><div class="hero-l"><span>Beneficio</span>${dB}</div>
      <div class="big ${B < 0 ? 'neg' : ''}" id="heroNum" data-to="${B}">${splitC(money(B))}</div>
      <div class="tiles two"><div class="tile"><span>Facturación</span><b>${money0(F)}</b></div><div class="tile"><span>Gastos</span><b>${money0(Gs)}</b></div></div></section>${S.off === 0 ? `<div class="qa"><button class="btn btn-main" data-action="newSale">${G.sell}Apuntar venta</button><button class="btn btn-soft" data-action="newExpense">${G.bag}Gasto</button></div>` : ""}`;
  h += totalCard();
  h += lowStockAlert();
  if (!cnt && !Gs) return h + empty(G.sell, 'Sin actividad', S.off === 0 ? 'Toca + cuando vendas algo.' : '', S.off === 0 ? '<button class="btn btn-main btn-sm" data-action="newSale">Apuntar venta</button>' : '');

  const nG = S.per === 'year' ? 12 : 6;
  const groups = Array.from({ length: nG }, (_, i) => {
    const rr = S.per === 'year' ? (() => { const y = periodR(S.off)[2].getFullYear(), d = new Date(y, i, 1); return [ymd(d), ymd(new Date(y, i + 1, 1)), d]; })() : monthR(S.off - (nG - 1) + i);
    const f = fac(rr), g = gas(rr);
    return { label: MONTHS[rr[2].getMonth()], vals: [f, g], cur: S.per === 'month' ? i === nG - 1 : false, tip: `${MONTHS_L[rr[2].getMonth()]} ${rr[2].getFullYear()}\nFacturación ${money(f)}\nGastos ${money(g)}\nBeneficio ${money(f - g)}` };
  });
  h += `<section class="card"><div class="ch"><h2>Evolución</h2><div class="legend"><span><i class="sw" style="background:var(--accent)"></i>Facturación</span><span><i class="sw" style="background:var(--mute)"></i>Gastos</span></div></div>
    ${barChart(groups, [{ name: 'Facturación', color: 'var(--accent)' }, { name: 'Gastos', color: 'var(--mute)' }], { H: 150, noY: true })}</section>`;

  return h + porMovil(sl);
}
function porMovil(sl, cls = '') {
  const accs = accounts().map(a => { const s = sl.filter(x => x.account === a.id); return { a, f: sum(s, x => x.price) }; }).sort((x, y) => y.f - x.f);
  const orphan = sl.filter(x => !acc(x.account));
  let h = '';
  if (accs.length) h += `<section class="card ${cls}"><div class="ch"><h2>Por móvil</h2><button class="lnk" data-action="tab" data-tab="moviles">Ver${G.right}</button></div>
    <div class="split">${accs.filter(x => x.f > 0).map(x => `<i style="flex:${x.f};background:${accColor(x.a.id)}" data-tip="${esc(x.a.name)}\n${money(x.f)}"></i>`).join('')}</div>
    <div class="mrows">${accs.map(({ a, f }) => `<button class="mrow" data-action="account" data-id="${a.id}"><span class="mav" style="${tint(accColor(a.id))}">${accInitial(a)}</span><span class="rm"><span class="rt">${esc(a.name)}</span></span><span class="mr"><b class="mamt">${money(f)}</b>${warmChip(a, true)}</span></button>`).join('')}${orphan.length ? `<div class="mrow"><span class="mav" style="${tint('var(--ink2)')}">·</span><span class="rm"><span class="rt">Móviles borrados</span></span><b class="mamt">${money(sum(orphan, x => x.price))}</b></div>` : ''}</div></section>`;
  return h;
}

/* ---------- PANEL COMPLETO (ordenador) ---------- */
const kpi = (label, value, delta, sub) => `<section class="kpi"><div class="kpi-l"><span>${label}</span>${delta || ''}</div><div class="kpi-v">${value}</div>${sub ? `<small>${sub}</small>` : ''}</section>`;
const hbars = rows => { const mx = Math.max(1, ...rows.map(r => r[1]));
  return `<div class="hbar">${rows.map(([t, n, v]) => `<div class="hrow"><span class="nm">${esc(t)}</span><span class="vl">${v}</span><span class="tr"><i data-w="${n / mx * 100}" style="width:${S.animate ? 0 : n / mx * 100}%"></i></span></div>`).join('')}</div>`; };
const noData = t => `<p class="hint">${t}</p>`;
function vPanelDesk() {
  const d = new Date();
  let h = `<header class="top"><div><div class="eyebrow">${cap(DAYS[d.getDay()])}, ${d.getDate()} de ${MONTHS_L[d.getMonth()]}</div><h1>Panel</h1></div><div class="dk-ctl">${periodCtl()}<button class="round" data-action="more" aria-label="Ajustes">${G.dots}</button></div></header>`;
  if (!loadedAll() || S.error) return h + loading();
  const r = periodR(S.off), pr = periodR(S.off - 1);
  const sl = okSales().filter(s => inR(s.date, r)), psl = okSales().filter(s => inR(s.date, pr));
  const F = fac(r), Gs = gas(r), B = r2(F - Gs), pF = fac(pr), pB = r2(pF - gas(pr));
  const uds = sum(sl, s => s.qty || 1), pu = sum(psl, s => s.qty || 1);
  const tk = sl.length ? r2(F / sl.length) : 0, ptk = psl.length ? r2(pF / psl.length) : 0;
  const wc = sl.filter(s => s.cost > 0), wcF = sum(wc, s => s.price), mg = wcF ? Math.round(sum(wc, saleProfit) / wcF * 100) : null;
  const dev = S.sales.filter(s => s.status === 'devuelta' && inR(s.date, r)).length;
  const dB = B === pB ? '' : `<span class="delta ${B > pB ? 'up' : 'down'}">${B > pB ? '▲ +' : '▼ −'}${money0(Math.abs(B - pB))}</span>`;
  let g = `<section class="hero s5"><div class="hero-l"><span>Beneficio · ${periodName(S.off)}</span>${dB}</div>
      <div class="big ${B < 0 ? 'neg' : ''}" id="heroNum" data-to="${B}">${splitC(money(B))}</div>
      <div class="tiles two"><div class="tile"><span>Facturación</span><b>${money0(F)}</b></div><div class="tile"><span>Gastos</span><b>${money0(Gs)}</b></div></div></section>`;
  g += `<div class="kgrid s7">${kpi('Unidades vendidas', uds, deltaChip(uds, pu), `${sl.length} ${sl.length === 1 ? 'venta' : 'ventas'}`)}${kpi('Ticket medio', money(tk), deltaChip(tk, ptk), 'por venta')}${kpi('Margen', mg === null ? '—' : mg + ' %', '', mg === null ? 'Sin costes guardados' : 'de lo vendido con coste')}${kpi('Devoluciones', dev, '', dev ? Math.round(dev / (sl.length + dev) * 100) + ' % de las ventas' : 'Ninguna')}</div>`;

  /* evolución: 12 meses */
  const groups = Array.from({ length: 12 }, (_, i) => {
    const rr = S.per === 'year' ? (() => { const y = r[2].getFullYear(), dd = new Date(y, i, 1); return [ymd(dd), ymd(new Date(y, i + 1, 1)), dd]; })() : monthR(S.off - 11 + i);
    const f = fac(rr), gg = gas(rr);
    return { label: MONTHS[rr[2].getMonth()], vals: [f, gg], cur: S.per === 'month' && i === 11, tip: `${MONTHS_L[rr[2].getMonth()]} ${rr[2].getFullYear()}\nFacturación ${money(f)}\nGastos ${money(gg)}\nBeneficio ${money(f - gg)}` };
  });
  g += `<section class="card s8"><div class="ch"><h2>Evolución · 12 meses</h2><div class="legend"><span><i class="sw" style="background:var(--accent)"></i>Facturación</span><span><i class="sw" style="background:var(--mute)"></i>Gastos</span></div></div>
    ${barChart(groups, [{ name: 'Facturación', color: 'var(--accent)' }, { name: 'Gastos', color: 'var(--mute)' }], { W: 720, H: 240 })}</section>`;
  g += porMovil(sl, 's4') || `<section class="card s4"><div class="ch"><h2>Por móvil</h2></div>${noData('Añade tus móviles en la sección Móviles.')}</section>`;

  /* productos, categorías y tallas del periodo */
  const by = {}; sl.forEach(s => { const k = s.productId || 'n:' + s.name, o = by[k] || (by[k] = { s, u: 0, rev: 0 }); o.u += s.qty || 1; o.rev += s.price || 0; });
  const top = Object.values(by).sort((a, b) => b.rev - a.rev || b.u - a.u).slice(0, 6);
  g += `<section class="card s4"><div class="ch"><h2>Más vendidos</h2></div>${top.length ? `<div class="rows">${top.map(o => `<div class="row">${th(prod(o.s.productId) || o.s)}<span class="rm"><span class="rt">${esc(o.s.name)}</span><span class="rs">${o.u} ${o.u === 1 ? 'ud' : 'uds'}</span></span><span class="rv"><b>${money0(o.rev)}</b></span></div>`).join('')}</div>` : noData('Sin ventas en este periodo.')}</section>`;
  const ct = {}; sl.forEach(s => { const k = catKey(s), o = ct[k] || (ct[k] = { u: 0, rev: 0 }); o.u += s.qty || 1; o.rev += s.price || 0; });
  const ctl = CAT_ORDER.filter(k => ct[k]).sort((a, b) => ct[b].rev - ct[a].rev);
  g += `<section class="card s4"><div class="ch"><h2>Categorías</h2></div>${ctl.length ? hbars(ctl.map(k => [CATS[k].label, ct[k].rev, `${money0(ct[k].rev)} · ${ct[k].u} uds`])) : noData('Sin ventas en este periodo.')}</section>`;
  const sz = {}; sl.forEach(s => { if (s.size) sz[s.size] = (sz[s.size] || 0) + (s.qty || 1); });
  const szl = Object.entries(sz).sort((a, b) => b[1] - a[1]).slice(0, 7);
  g += `<section class="card s4"><div class="ch"><h2>Tallas más vendidas</h2></div>${szl.length ? hbars(szl.map(([t, n]) => [t, n, '×' + n])) : noData('Sin tallas en este periodo.')}</section>`;

  /* últimos movimientos */
  const mv = allMoves().slice(0, 12), days0 = []; mv.forEach(m => { const x = days0[days0.length - 1]; if (x && x.d === m.d) x.m.push(m); else days0.push({ d: m.d, m: [m] }); });
  g += `<section class="card s8"><div class="ch"><h2>Últimos movimientos</h2><button class="lnk" data-action="tab" data-tab="movs">Ver todos${G.right}</button></div>${mv.length ? days0.map(x => `<div class="day"><span>${dayLabel(x.d)}</span></div><div class="rows">${x.m.map(moveRow).join('')}</div>`).join('') : noData('Aún no hay movimientos.')}</section>`;

  /* stock */
  const stU = sum(S.products, units), stC = r2(sum(S.products, p => units(p) * (p.cost || 0))), stP = r2(sum(S.products, p => units(p) * (p.price || 0)));
  const low = S.products.filter(p => units(p) <= 1).sort((a, b) => units(a) - units(b)).slice(0, 5);
  g += `<section class="card s4"><div class="ch"><h2>Stock</h2><button class="lnk" data-action="tab" data-tab="stock">Ver${G.right}</button></div>
    <div class="stat3"><div><span>Unidades</span><b>${stU}</b></div><div><span>Valor a coste</span><b>${money0(stC)}</b></div><div><span>Valor a venta</span><b>${money0(stP)}</b></div></div>
    ${low.length ? `<div class="sub-h">Por reponer</div><div class="rows">${low.map(p => `<div class="row">${th(p)}<span class="rm"><span class="rt">${esc(p.name)}</span><span class="rs">${units(p) ? units(p) + ' ud' : 'Agotado'}</span></span><button class="qbtn soft" data-action="addUnits" data-id="${p.id}">Reponer</button></div>`).join('')}</div>` : ''}</section>`;

  /* pedidos: cuánto llevas recuperado de cada uno */
  const ords = S.expenses.filter(e => e.category === 'pedido' && S.products.some(p => p.orderId === e.id)).sort((a, b) => (b.date || '').localeCompare(a.date || '')).slice(0, 5);
  g += `<section class="card s6"><div class="ch"><h2>Pedidos recientes</h2></div>${ords.length ? `<div class="rows">${ords.map(e => { const ps = S.products.filter(p => p.orderId === e.id), back = sum(okSales().filter(s => ps.some(p => p.id === s.productId)), s => s.price), pct = e.amount ? Math.round(back / e.amount * 100) : 0;
      return `<button class="row" data-action="expense" data-id="${e.id}"><span class="th">${G.bag}</span><span class="rm"><span class="rt">${esc(e.concept)}</span><span class="rs">${fmtDate(e.date)} · recuperado ${pct} %</span><span class="prog" style="display:block;margin-top:6px"><i style="width:${Math.min(100, pct)}%"></i></span></span><span class="rv"><b>${money0(e.amount)}</b><small>${money0(back)} vendido</small></span></button>`; }).join('')}</div>` : noData('Cuando apuntes una compra al proveedor verás aquí cuánto has recuperado.')}</section>`;

  /* total y móviles */
  const accs = accounts(), warm = accs.filter(a => a.warm).length, blk = sum(accs, a => (a.blocks || []).filter(b => inR(b.date, r)).length);
  g += `<div class="dk-col s6">${totalCard()}${lowStockAlert()}<section class="card"><div class="ch"><h2>Móviles</h2><button class="lnk" data-action="tab" data-tab="moviles">Ver${G.right}</button></div>
    <div class="stat3"><div><span>Móviles</span><b>${accs.length}</b></div><div><span>Calentadas</span><b>${warm}</b></div><div><span>Bloqueos</span><b>${blk}</b></div></div></section></div>`;
  return h + `<div class="dk">${g}</div>`;
}

/* ---------- INICIO RÁPIDO (móvil) ---------- */
function vQuick() {
  const btn = (act, glyph, title) => `<button class="qk" data-action="${act}"><span class="qk-i">${glyph}</span><b>${title}</b></button>`;
  return `<div class="qs-grid">${btn('newSale', G.sell, 'Venta')}${btn('newBuy', G.cart, 'Compra')}${btn('qReturn', G.ret, 'Devolución')}${btn('qStock', G.inbox, 'Añadir stock')}</div>
    <button class="qs-enter" data-action="enterApp" aria-label="Entrar a la app (o desliza hacia arriba)"><i></i></button>`;

/* ---------- BLOQUEOS: cuenta bloqueada → móvil formateado → cuenta nueva con otro IBAN ---------- */
/* Cada móvil guarda las cuentas que ha tenido: a.blocks = [{date, iban, reason, warm}], de más antigua a más reciente */
function accGens(a) {
  const bl = (a.blocks || []).slice().sort((x, y) => (x.date || '').localeCompare(y.date || ''));
  const mine = S.sales.filter(s => s.account === a.id);
  const first = mine.map(s => s.date).filter(Boolean).sort()[0];
  const made = a.createdAt && a.createdAt > 9e11 ? ymd(new Date(a.createdAt)) : today();
  let start = first && first < made ? first : made, prev = '';
  const g = bl.map(b => { const o = { from: start, prev, to: b.date, iban: b.iban, reason: b.reason, done: true }; start = b.date; prev = b.date; return o; });
  g.push({ from: start, prev, to: null, iban: a.iban, warm: a.warm, current: true });
  g.forEach(x => { const ok = mine.filter(s => s.status !== 'devuelta' && (!x.prev || s.date > x.prev) && (!x.to || s.date <= x.to)); x.n = sum(ok, s => s.qty || 1); x.fac = r2(sum(ok, s => s.price)); x.dias = days(x.from, x.to || today()); });
  return g;
}
/* IBAN que tenía el móvil el día de la venta (para los exportes) */
function ibanAt(a, date) {
  if (!a) return '';
  const b = (a.blocks || []).slice().sort((x, y) => (x.date || '').localeCompare(y.date || '')).find(x => date && date <= x.date);
  return b ? b.iban : a.iban;
}
function warmupCard(a) {
  const w = a.warmup; if (!w) return "";
  const rows = [["Alta", w.inicio ? fmtDate(w.inicio) : "—"], ["Días completados", w.diasHechos ?? "—"], ["Valoraciones", w.valoraciones != null ? w.valoraciones + (w.media ? " · media " + String(w.media).replace(".", ",") : "") : "—"], ["Índice de confianza", w.indice != null ? String(w.indice).replace(".", ",") + " / 5" : "—"], ["Artículos de calentamiento", w.articulos ?? "—"]];
  return `<div class="sec-h"><h2>Calentamiento</h2><span>${w.enviado ? "Enviado " + fmtDate(w.enviado) : ""}</span></div><div class="facts">${rows.map(([k, v]) => `<div class="fact"><span>${k}</span><b>${esc(v)}</b></div>`).join("")}</div>`;
}
const diasTxt = n => n === null ? '' : n === 0 ? 'Menos de un día' : n + (n === 1 ? ' día' : ' días');
function gensCard(a) {
  const g = accGens(a).reverse(), done = g.filter(x => x.done), avg = done.length ? Math.round(sum(done, x => x.dias || 0) / done.length) : 0;
  const row = x => x.current
    ? `<div class="row"><span class="th" style="${tint('var(--ink)')}">${G.phone}</span><span class="rm"><span class="rt">Cuenta actual</span><span class="rs">Desde ${fmtDate(x.from)} · ${diasTxt(x.dias)}</span></span><span class="rv"><b>${money0(x.fac)}</b><span class="rs">${x.n} ${x.n === 1 ? 'venta' : 'ventas'}</span></span></div>`
    : `<div class="row"><span class="th" style="${tint('var(--ink3)')}">${G.x}</span><span class="rm"><span class="rt">Bloqueada · ${fmtDate(x.to)}</span><span class="rs">Duró ${diasTxt(x.dias).toLowerCase()}${x.iban ? ' · ••' + String(x.iban).slice(-4) : ''}</span></span><span class="rv"><b>${money0(x.fac)}</b><span class="rs">${x.n} ${x.n === 1 ? 'venta' : 'ventas'}</span></span></div>`;
  return `<div class="sec-h"><h2>Cuentas</h2><span>${done.length ? `${done.length} ${done.length === 1 ? 'bloqueo' : 'bloqueos'} · media ${avg} d` : 'Sin bloqueos'}</span></div>
    <div class="list">${g.map(row).join('')}</div>
    <button class="btn btn-danger btn-block" data-action="blockAcc" data-id="${a.id}">Cuenta bloqueada</button>`;
}
function blockSheet(id) {
  const a = acc(id); if (!a) return;
  openSheet('Cuenta bloqueada', `<p class="hint" style="margin:0;font-size:14.5px;line-height:1.5">${esc(a.name)} empieza una cuenta nueva. La anterior se guarda en el historial y sus ventas siguen contando.</p>
    <form class="f" id="blkF" novalidate>
      <div class="fld"><label for="b-iban">IBAN de la cuenta nueva</label><input id="b-iban" name="iban" class="mono" placeholder="ES00 0000 0000 0000 0000 0000" autocomplete="off" autocapitalize="characters" spellcheck="false"></div>
      <div class="fld"><label for="b-why">Motivo (opcional)</label><input id="b-why" name="reason" placeholder="Verificación, venta marcada…" autocomplete="off"></div>

    async fd => {

      const old = { iban: a.iban || '', warm: !!a.warm, blocks: a.blocks || [] };

}

const saleProfit = s => r2((s.price || 0) - (s.cost || 0));
function vMovil(id) {

  if (!loadedAll() || S.error) return h + loading();
  const r = accRange(), mine = S.sales.filter(s => s.account === id);
  h += `<div class="accctl"><div class="seg" data-k="accp" role="group" aria-label="Periodo">${[['month', 'Mes'], ['year', 'Año'], ['all', 'Total']].map(([k, l]) => `<button data-action="accP" data-v="${k}" aria-pressed="${S.accP === k}">${l}</button>`).join('')}</div>${S.accP === 'all' ? '' : `<div class="mnav"><button class="arr" data-action="accOff" data-d="-1" aria-label="Anterior">${G.left}</button><b>${accPeriodName()}</b><button class="arr" data-action="accOff" data-d="1" aria-label="Siguiente" ${S.accOff >= 0 ? 'disabled' : ''}>${G.right}</button></div>`}</div>`;
  const ss = mine.filter(s => inR(s.date, r)), ok = ss.filter(s => s.status !== 'devuelta'), ret = ss.length - ok.length;
  const F = r2(sum(ok, s => s.price)), B = r2(sum(ok, saleProfit)), uds = sum(ok, s => s.qty || 1);
  h += `<section class="hero"><div class="hero-l"><span>Beneficio</span></div><div class="big ${B < 0 ? 'neg' : ''}">${splitC(money(B))}</div>

  if (!ss.length) h += empty(G.sell, 'Sin ventas', S.accP === 'all' ? 'Este móvil aún no ha vendido nada.' : 'Nada en este periodo.');
  else {
    /* evolución del móvil */
    const nG = S.accP === 'year' ? 12 : 6, base = S.accP === 'year' ? yearR(S.accOff)[2].getFullYear() : 0;
    const groups = Array.from({ length: nG }, (_, i) => {
      const rr = S.accP === 'year' ? (() => { const d = new Date(base, i, 1); return [ymd(d), ymd(new Date(base, i + 1, 1)), d]; })() : monthR((S.accP === 'all' ? 0 : S.accOff) - (nG - 1) + i);
      const o = mine.filter(s => s.status !== 'devuelta' && inR(s.date, rr)), f = sum(o, s => s.price), b = sum(o, saleProfit);

async function compress(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ko; i.src = url; });

  } finally { URL.revokeObjectURL(url); }
}

      const ok = await write(async () => {

        const bump = (pid, size, d) => { if (!pid || !prod(pid)) return; const k = pid; adj[k] = adj[k] || (prod(pid).sizes || []).map(s => ({ ...s })); const e = adj[k].find(s => s.s === size); if (e) e.q = Math.max(0, e.q + d); else if (d > 0) adj[k].push({ s: size || 'Única', q: d }); };

        if (t.dataset.pick) { st.pid = t.dataset.pick; st.size = ''; st.qty = 1; const p = prod(st.pid); if (p && p.price && !$('#s-price').value) { $('#s-price').value = val(p.price); fit($('#s-price')); }
          if (p && p.account && !document.querySelector('input[name="account"]:checked')) { const r = document.querySelector(`input[name="account"][value="${p.account}"]`); if (r) r.checked = true; } haptic(1); paint(); }
        if (t.dataset.scat) { st.cat = t.dataset.scat; paint(); }
        if (t.dataset.mode) { st.free = t.dataset.mode === 'free'; st.pid = ''; st.size = ''; st.qty = 1; paint(); }

      box.addEventListener('change', ev => { if (ev.target.name === 'size') { st.size = ev.target.value; st.qty = 1; } });
      if (!S.products.some(x => units(x) > 0) && !st.pid) st.free = true;

}
function pickerHtml(list, q, sel, cat) {

  const other = `<button type="button" class="sk other" data-mode="free"><span class="pc-img">${G.plus}</span><span>Otro · no está en stock</span></button>`;
  return other + l.map(p => `<button type="button" class="sk" data-pick="${p.id}" aria-pressed="${p.id === sel}"><span class="pc-img" style="${p.photo ? '' : tint(catOf(p).color)}">${p.photo ? `<img src="${BLOB_URL}${esc(p.photo)}" alt="" loading="lazy">` : catOf(p).g}<span class="pc-qty">${units(p)}</span></span><span>${esc(p.name)}</span></button>`).join('') + (l.length ? '' : '<span class="hint" style="grid-column:1/-1;margin:0;padding:6px 4px">Nada coincide en tu stock</span>');
}

/* ---------- MI LISTA DE PEDIDOS: los artículos que compras siempre ---------- */
/* catalog: {name, category, price, sizes (lo último que pediste), uses, last, hidden}. Lo que tienes en stock también aparece, y se puede renombrar o quitar igual. */
let catList = [], catCur = null;
const lname = n => String(n || '').trim().toLowerCase();
const stockHas = n => S.products.some(p => lname(p.name) === lname(n));
function catItems() {
  const seen = new Set(S.catalog.map(c => lname(c.name))), out = [];
  S.catalog.filter(c => !c.hidden).sort((a, b) => (b.uses || 0) - (a.uses || 0) || String(a.name).localeCompare(b.name)).forEach(c =>
    out.push({ id: c.id, name: c.name, cat: CATS[c.category] ? c.category : 'otro', price: c.price || 0, cost: c.cost || 0, sizes: c.sizes || [] }));
  S.products.forEach(p => { const k = lname(p.name); if (!seen.has(k)) { seen.add(k); out.push({ id: '', name: p.name, cat: catKey(p), price: p.price || 0, cost: p.cost || 0, sizes: [] }); } });
  return out;
}
const sizesLine = a => (a || []).filter(s => s.q > 0).map(s => s.s === 'Única' ? '×' + s.q : s.s + '×' + s.q).join('  ');
/* guarda cambios de un artículo de la lista (los del stock se convierten en artículos propios de la lista) */
async function catUpsert(item, patch) {
  const name = String(patch.name !== undefined ? patch.name : item.name).trim(); if (!name) return false;
  const category = patch.category || item.cat, price = patch.price !== undefined ? patch.price : item.price;
  if (lname(name) !== lname(item.name) && catItems().some(c => lname(c.name) === lname(name))) { toast('Ya tienes ese artículo en la lista'); return false; }
  const tomb = item.name && lname(name) !== lname(item.name) && stockHas(item.name);
  return write(async () => {
    if (item.id) await db.doc('catalog/' + item.id).update({ name, category, price, hidden: false });
    else await db.collection('catalog').add({ name, category, price, cost: item.cost || 0, sizes: [], uses: 0, last: '', createdAt: Date.now() });
    if (tomb) await db.collection('catalog').add({ name: item.name, category: item.cat, price: 0, sizes: [], uses: 0, last: '', hidden: true, createdAt: Date.now() });
  }, 'Guardado');
}
async function catRemove(item) {
  const msg = 'Quitado de tu lista';
  if (item.id && !stockHas(item.name)) { const copy = strip(S.catalog.find(c => c.id === item.id) || {});
    return write(() => db.doc('catalog/' + item.id).delete(), msg, () => write(() => db.doc('catalog/' + item.id).set(copy), 'Recuperado')); }
  if (item.id) return write(() => db.doc('catalog/' + item.id).update({ hidden: true }), msg, () => write(() => db.doc('catalog/' + item.id).update({ hidden: false }), 'Recuperado'));
  let nid = '';
  return write(async () => { const r = await db.collection('catalog').add({ name: item.name, category: item.cat, price: 0, sizes: [], uses: 0, last: '', hidden: true, createdAt: Date.now() }); nid = r.id; }, msg, () => write(() => db.doc('catalog/' + nid).delete(), 'Recuperado'));
}
function catalogSheet() {
  catList = catItems();
  openSheet('Mi lista de pedidos', `<p class="hint" style="margin:0;font-size:14px;line-height:1.5">Los artículos que compras. Al hacer un pedido los tocas y salen con las tallas de la última vez. Toca uno para cambiarle el nombre o quitarlo.</p>
    ${catList.length ? `<div class="list">${catList.map((c, k) => `<button class="row" data-action="catItem" data-k="${k}"><span class="th" style="${tint(CATS[c.cat].color)}">${CATS[c.cat].g}</span><span class="rm"><span class="rt">${esc(c.name)}</span><span class="rs">${sizesLine(c.sizes) || CATS[c.cat].label}</span></span>${G.chev}</button>`).join('')}</div>`
      : '<p class="hint" style="margin:0">Todavía no hay nada. Se llena sola con tu primer pedido, o añade artículos a mano.</p>'}
    <button class="btn btn-main btn-block" data-action="newCatItem">${G.plus}Añadir artículo</button>`);
}

function expenseForm(e, preset) {
  const isNew = !e; e = e || { date: today(), category: preset || 'pedido' };
  /* un pedido puede traer varios productos, cada uno con sus tallas y unidades */
  const st = { lines: [{ name: '', cat: store.get('lastCat') || 'zapatillas', price: '', sizes: [] }] };
  const lineUnits = () => sum(st.lines.filter(l => l.name.trim() || l.cat !== 'jellycat'), l => sum(l.sizes, s => s.q));
  openSheet(isNew ? (e.category === 'pedido' ? 'Nueva compra' : 'Nuevo gasto') : 'Editar gasto', `<form class="f" id="expF" novalidate>
    ${amountField('e-amount', 'amount', 'Importe total', e.amount)}
    <div class="chips" role="radiogroup" aria-label="Tipo">${Object.entries(EXP_CATS).map(([k, l]) => `<label><input type="radio" name="category" value="${k}" ${(e.category === 'envios' ? 'otros' : e.category) === k ? 'checked' : ''}><span>${l}</span></label>`).join('')}</div>
    ${isNew ? '<div class="fld" id="orderBox"></div>' : ''}
    <div class="fld"><label for="e-concept">Proveedor o concepto</label><input id="e-concept" name="concept" placeholder="Proveedor Nike" value="${esc(e.concept)}" autocapitalize="sentences"></div>
    <div class="grid2"><div class="fld"><label for="e-date">Fecha</label><input id="e-date" name="date" type="date" value="${esc(e.date)}"></div>
      <div class="fld"><label for="e-units">Unidades</label><input id="e-units" name="units" type="number" min="0" inputmode="numeric" placeholder="12" value="${e.units || ''}"></div></div>
    <p class="hint" style="margin:0" id="perU"></p>
    <button class="btn btn-main btn-block">${isNew ? 'Apuntar gasto' : 'Guardar'}</button></form>`,
    async fd => {
      const pedido = fd.get('category') === 'pedido';
      const lines = isNew && pedido ? st.lines.map(l => ({ name: l.name.trim(), cat: l.cat, price: num(l.price), cost: num(l.cost), sizes: l.sizes.map(s => ({ s: String(s.s || '').trim() || 'Única', q: Math.max(0, s.q | 0) })).filter(s => s.q > 0) })).filter(l => l.name || (l.cat !== 'jellycat' && l.sizes.length)) : [];
